<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Автоответчик{% endblock %}</title>
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="bi bi-robot"></i>
      <span>AI_АВТООТВЕТЧИК</span>
      <button type="button" class="sidebar-toggle" id="sidebarToggle"
              aria-label="Открыть меню" aria-expanded="false" aria-controls="sidebarNav">
        <i class="bi bi-list"></i>
      </button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">
        <i class="bi bi-speedometer2"></i> Обзор
      </a>
      <a href="/accounts" class="{{ 'active' if request.url.path.startswith('/accounts') else '' }}">
        <i class="bi bi-person-badge"></i> Аккаунты
      </a>
      <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') else '' }}">
        <i class="bi bi-sliders"></i> Настройки
      </a>
      <a href="/logs" class="{{ 'active' if request.url.path.startswith('/logs') else '' }}">
        <i class="bi bi-chat-left-text"></i> Логи
      </a>
    </nav>
    <div class="sidebar-status"><span class="dot"></span> SYSTEM ACTIVE
      <div class="small text-muted mt-1" title="Версия кода, который сейчас работает (короткий хеш коммита)">версия {{ app_version }}</div>
    </div>
    <a href="/logout" class="sidebar-logout"><i class="bi bi-box-arrow-right"></i> Выход</a>
  </aside>
  <main class="main-content">
    <div class="main-inner">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
<script>
// Мобильное меню: чистый JS без зависимостей (в проекте нет bootstrap.bundle.js,
// только bootstrap.min.css — JS-компоненты Bootstrap здесь не подключены).
(function () {
  var btn = document.getElementById('sidebarToggle');
  var sidebar = document.getElementById('sidebar');
  if (!btn || !sidebar) return;
  btn.addEventListener('click', function () {
    var open = sidebar.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
