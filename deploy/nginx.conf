# /etc/nginx/sites-available/ai-responder.conf
# ln -s /etc/nginx/sites-available/ai-responder.conf /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

upstream ai_responder_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1g;   # загрузка архивов TData (.zip/.rar), .session, managers.xlsx
    client_body_timeout 300s;  # долгая загрузка большого архива по медленному каналу

    location /static/ {
        alias /opt/ai-responder/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://ai_responder_app;
        proxy_http_version 1.1;
        # поддержка WebSocket (на случай live-обновлений логов в будущем)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
